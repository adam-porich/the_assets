# nginx location block for the Portrait Workbench app.
#
# This is NOT a standalone server block. Add it inside the existing finance
# server { listen 443 ssl; server_name desktop-g62m1s8.taild55c40.ts.net; }
# block so the workbench is served under /assets/.
#
# Reach it from Tailscale at:
#   https://desktop-g62m1s8.taild55c40.ts.net/assets/

location = /assets {
    return 301 /assets/;
}

location /assets/api/ {
    rewrite ^/assets(/api/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /assets/asset/ {
    rewrite ^/assets(/asset/.*)$ $1 break;
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}

location /assets/ {
    proxy_pass http://127.0.0.1:5182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
